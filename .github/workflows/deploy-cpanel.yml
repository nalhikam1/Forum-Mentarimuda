name: Deploy Forum to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 / 24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Bundle
        run: npm run build

      # Opsional: Jika menggunakan FTP deploy ke cPanel public_html
      - name: Sync dist to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.CPANEL_FTP_SERVER != ''
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: dist/
          protocol: ftp
